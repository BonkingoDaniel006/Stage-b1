<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutiSafe - Paramètres</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <i class="fa-solid fa-shield-heart"></i>
      <span>AutiSafe</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fa-solid fa-house"></i> Accueil</a></li>
      <li><a href="profile.html"><i class="fa-solid fa-child"></i> Profil Enfant</a></li>
      <li><a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> Paramètres</a></li>
    </ul>
  </nav>

  <main class="container">
    <h2 style="margin-bottom: 1.5rem; color: var(--primary-blue);">Paramètres de l'application</h2>

    <div class="card">
      <h3 style="margin-bottom: 1rem; color: var(--primary-blue);">
        <i class="fa-solid fa-bell"></i> Notifications & Alertes
      </h3>
      <div class="form-group">
        <label style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" checked style="width: 18px; height: 18px;">
          Alerte SMS immédiate lors d'un scan du QR code
        </label>
      </div>
      <div class="form-group">
        <label style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" checked style="width: 18px; height: 18px;">
          Notification Email en cas de géolocalisation approximative (IP)
        </label>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 1rem; color: var(--primary-blue);">
        <i class="fa-solid fa-lock"></i> Confidentialité du QR Code
      </h3>
      <div class="form-group">
        <label>Mode de diffusion des données</label>
        <select class="form-control">
          <option selected>Public restreint (Informations médicales masquées sans appel)</option>
          <option>Urgence totale (Tout afficher immédiatement au scan)</option>
        </select>
      </div>
    </div>

    <div class="card" style="border-left: 4px solid var(--primary-blue);">
      <h3 style="margin-bottom: 0.5rem; color: var(--primary-blue);">
        <i class="fa-solid fa-building-flag"></i> À propos
      </h3>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">
        AutiSafe v1.0 — Développé pour l'association <strong>Autisme Hauts-de-France</strong>.
      </p>
    </div>
  </main>

</body>
</html>
